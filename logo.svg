<!-- Bank of Wisdom Logo with BOW Acronym -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" width="200" height="220">
  <!-- Background -->
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A90E2" />
      <stop offset="100%" stop-color="#50C9C3" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/> 
        <feMergeNode in="SourceGraphic"/> 
      </feMerge>
    </filter>
  </defs>

  <!-- Circular background -->
  <circle cx="100" cy="105" r="95" fill="url(#gradient)" />

  <!-- Inner circle (white) -->
  <circle cx="100" cy="105" r="70" fill="white" />

  <!-- Open book icon -->
  <path d="M 70 95 L 70 115 L 80 115 L 80 95 Z" fill="#2D3142" />
  <path d="M 80 95 L 80 115 L 120 115 L 120 95 Z" fill="#4ECDC4" />
  <path d="M 90 115 L 90 130 L 110 130 L 110 115 Z" fill="#F7931E" />
  <path d="M 120 95 L 120 115 L 130 115 L 130 95 Z" fill="#2D3142" />

  <!-- BOW Acronym inside the circle -->
  <text x="100" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#2D3142" dominant-baseline="middle">BOW</text>

  <!-- Sparkle effects (stars representing wisdom) -->
  <circle cx="50" cy="50" r="5" fill="#FFD23F" />
  <circle cx="150" cy="50" r="4" fill="#FFD23F" />
  <circle cx="150" cy="155" r="3" fill="#FFD23F" />
  <circle cx="50" cy="155" r="4" fill="#FFD23F" />

  <!-- Text below icon -->
  <text x="100" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2D3142">BANK OF WISDOM</text>
  <text x="100" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666666">DIGITAL LIBRARY</text>
</svg>