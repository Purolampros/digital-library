<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bank of Wisdom - Digital Library</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="logo">
            <img src="logo.png" alt="Bank of Wisdom Logo"> <!-- You'll need to add your logo file -->
            <h1>Bank of Wisdom</h1>
        </div>
        <nav>
            <ul>
                <li><a href="#home">Home</a></li>
                <li><a href="#books">Books</a></li>
                <li><a href="#authors">Authors</a></li>
                <li><a href="#about">About</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
    </header>

    <section id="home" class="hero">
        <div class="hero-content">
            <h2>Welcome to the Bank of Wisdom</h2>
            <p>Your digital gateway to knowledge and literature</p>
            <button class="cta-button">Explore Collection</button>
        </div>
    </section>

    <main>
        <section id="featured">
            <h2>Featured Books</h2>
            <div class="book-grid" id="featured-books">
                <!-- Books will be populated by JavaScript -->
            </div>
        </section>

        <section id="genres">
            <h2>Browse by Genre</h2>
            <div class="genre-container">
                <div class="genre-card" onclick="filterByGenre('fiction')
                    <h3>Fiction</h3>
                </div>
                <div class="genre-card" onclick="filterByGenre('nonfiction')">
                    <h3>Non-Fiction</h3>
                </div>
                <div class="genre-card" onclick="filterByGenre('science')">
                    <h3>Science</h3>
                </div>
                <div class="genre-card" onclick="filterByGenre('history')">
                    <h3>History</h3>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2023 Bank of Wisdom Digital Library</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
